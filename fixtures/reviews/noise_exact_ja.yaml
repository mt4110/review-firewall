version: 1
kind: synthetic_exact_non_blocking_cases
language: ja
notes:
  - question / suggestion / nit / praise の exact boundary を固定するための synthetic fixtures。
  - 全件 non-blocking で、expected.concern は null。
  - concern-heavy な runtime 語彙は避け、classifier の非 blocker taxonomy だけを見る。
  - broad-band の noise fixtures を補完するための sharp な exact-type fixture 群。
