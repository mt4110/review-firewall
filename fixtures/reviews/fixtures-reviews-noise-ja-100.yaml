version: 1
kind: synthetic_review_noise_cases
language: ja
notes:
- 外向けファイル名は shoumonai ではなく noise / preference / process_pressure / scope_drift を推奨。
- これは実際の過去PRの再現ではなく、レビュー摩擦パターンを固定する synthetic fixtures。
- この100件は全て non-blocking 側の訓練用ケース。
- 次段で true blocker 側の対照ケースを別ファイルで追加すると classifier の精度を見やすい。
