version: 1
kind: synthetic_concern_false_positive_cases
language: ja
notes:
- concern 抽出の過剰反応を防ぐための synthetic fixtures。
- 全件 non-blocking 想定で、expected.concern は null。
- キーワードが concern 語に見えても、この文脈では concern に昇格してはいけないケースを集めた。
- noise_ja / true_blockers_ja に加えて使うことで、extract_concern の語彙追加による overfitting を検知しやすくする。
cases:
- id: concern_fp_001
  category: correctness_fp
  looks_like_concern_ja: correctness
  trigger_token_ja: panic
  comment_ja: panic という単語が強いので README ではもう少し柔らかい表現にしたいです。
  expected:
    type: suggestion
    blocker: false
    concern: null
    reply: decline
    escalate: stay_in_pr
  reason_ja: 文言調整であり runtime correctness の指摘ではない。
