[workspace]
members = [
  "crates/rf-core",
  "crates/review-firewall",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["review-firewall contributors"]
repository = "https://github.com/mt4110/review-firewall"

[workspace.dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
time = { version = "=0.3.47", features = ["formatting", "macros"] }
